<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Vector Machines (SVM)</title>
<style>
/* A8 v3: Classification Learner hints as an italic paragraph (steps 8, 11, 12); C = "Box constraint level".
   A8 v2: sick/healthy and group A/B coloured in the text; new patient back to its place on every step;
   step 8 points fixed (only C), "Reset points" in step 7; new last step in 3D (dose, dose², dose³) with a plane.
   A8 v1: SVM step by step (slides 396-412, 431-454, 455-461).
   1 variable: cut-off, middle, margin, support vectors, soft margin.
   2 variables: line from the slides (y = 1 + x, margin 2.83) vs. widest street (y = 0.5x + 2.75, margin 3.13),
   drag points, extra point (4, 6) with slider C. Kernel trick: dose -> dose^2, two cut-offs.
   Linear SVM is solved live (SMO). Link with ?step=N (1-12) or #step=N. Accent = FH #F6A420. */
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1f2328; --muted:#5b626c; --line:#dadde1;
  --accent:#F6A420; --accent2:#CB6413; --accent-soft:rgba(246,164,32,.22);
  --red:#d7261e; --blue:#1f5fb4; --grey:#8a929b;
  --tred:rgba(215,38,30,.08); --tblue:rgba(31,95,180,.08); --street:rgba(246,164,32,.15);
  --font:"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#15171a; --panel:#1e2226; --ink:#eceef0; --muted:#a3abb4; --line:#3a4046;
    --red:#f0736b; --blue:#6aa2e6; --grey:#8d959e;
    --tred:rgba(240,115,107,.10); --tblue:rgba(106,162,230,.10); --street:rgba(246,164,32,.18);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;padding:16px clamp(12px,3vw,36px) 20px;max-width:1180px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:1.6rem;font-weight:650;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 12px}
.bar{display:grid;grid-template-columns:auto minmax(220px,1fr);gap:12px 28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.seg span{font-weight:600;color:var(--muted)}
button{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:#1f2328}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctl[hidden]{display:none}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.ctl output{font-variant-numeric:tabular-nums;background:var(--accent-soft);padding:0 6px;border-radius:6px}
.ctl .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
input[type=range]{width:100%;accent-color:var(--accent);height:24px;margin:4px 0 0}
.stepno{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.status{display:grid;grid-template-columns:1fr auto;gap:10px 28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px 18px;margin-bottom:12px;min-height:104px}
.status p{margin:0;font-size:1.12rem;max-width:68ch}
.status .cl{display:block;margin-top:8px;font-style:italic;color:var(--muted)}
.nums{display:flex;gap:24px;flex-wrap:wrap}
.nums div{text-align:right}
.nums .k{color:var(--muted);font-size:.8rem;white-space:nowrap}
.nums .v{font-size:1.4rem;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;min-width:0;max-width:820px;margin:0 auto}
.card h2{font-size:1.05rem;font-weight:650;margin:0 0 2px}
.card p{margin:2px 0 8px;color:var(--muted);font-size:.92rem}
.lg b{font-weight:700}
.r{color:var(--red)} .b{color:var(--blue)} .g{color:var(--grey)}
canvas{display:block;width:100%;height:auto;touch-action:pan-y}
canvas.free{touch-action:none}
@media (max-width:860px){.bar,.status{grid-template-columns:1fr}.nums{justify-content:flex-start}.nums div{text-align:left}}
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>Support Vector Machines (SVM)</h1>
    <p class="sub">Find the widest street between two groups.</p>
  </div>
  <button id="full" type="button">Fullscreen</button>
</div>

<div class="bar">
  <div class="btns">
    <button id="back" type="button">Back</button>
    <button id="next" type="button" class="primary">Next</button>
    <button id="reset" type="button">Reset</button>
    <button id="rp" type="button" hidden>Reset points</button>
    <span class="stepno" id="stepno"></span>
  </div>
  <div class="ctl" id="cBox" hidden>
    <label for="c">Penalty for mistakes C <output id="cOut"></output></label>
    <input id="c" type="range" min="0" max="100" step="1" value="9">
    <div class="ends"><span>soft margin</span><span>hard margin</span></div>
  </div>
  <div class="seg" role="group" aria-label="Part">
    <span>Part:</span>
    <button id="p1" type="button" aria-pressed="true">1 variable</button>
    <button id="p2" type="button" aria-pressed="false">2 variables</button>
    <button id="p3" type="button" aria-pressed="false">Kernel trick</button>
  </div>
</div>

<div class="status">
  <p id="say"></p>
  <div class="nums">
    <div><div class="k" id="k1"></div><div class="v" id="v1">–</div></div>
    <div><div class="k" id="k2"></div><div class="v" id="v2">–</div></div>
    <div><div class="k" id="k3"></div><div class="v" id="v3">–</div></div>
  </div>
</div>

<div class="card">
  <h2 id="title"></h2>
  <p id="legend" class="lg"></p>
  <canvas id="cv" width="760" height="480" style="aspect-ratio:760/480" aria-label="SVM plot"></canvas>
</div>

<script>
(function(){
"use strict";
var W=760,H=600,ANIM=750,LAST=11;
function hFor(step){return step<=4?480:600}
var FONT='"Segoe UI", "Helvetica Neue", Arial, sans-serif';
/* canvas text grows on narrow screens (phones via QR) */
var U=1,UC=1;function fs(n){return Math.round(n*U)}
function setU(){U=Math.max(1,Math.min(1.7,640/Math.max(320,Math.min(window.innerWidth,900)-40)));UC=Math.min(U,1.3)}
var $=function(id){return document.getElementById(id)};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function f1(x){return x.toFixed(1)} function f2(x){return x.toFixed(2)}
function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

/* ---------- linear soft-margin SVM: dual solved with SMO (maximal violating pair) ---------- */
function svmFit(X,Y,C){
  var n=X.length,a=new Array(n).fill(0),G=new Array(n).fill(-1),i,j,t;
  var D=X[0].length;function K(p,q){var r=0;for(var d=0;d<D;d++)r+=X[p][d]*X[q][d];return r}
  function up(t){return (Y[t]>0&&a[t]<C)||(Y[t]<0&&a[t]>0)}
  function low(t){return (Y[t]>0&&a[t]>0)||(Y[t]<0&&a[t]<C)}
  for(var it=0;it<20000;it++){
    var gmax=-Infinity,gmin=Infinity;i=-1;j=-1;
    for(t=0;t<n;t++){var v=-Y[t]*G[t];if(up(t)&&v>gmax){gmax=v;i=t}if(low(t)&&v<gmin){gmin=v;j=t}}
    if(i<0||j<0||gmax-gmin<1e-9)break;
    var ai=a[i],aj=a[j],quad=Math.max(K(i,i)+K(j,j)-2*K(i,j),1e-12);
    if(Y[i]!==Y[j]){
      var d=(-G[i]-G[j])/quad,diff=a[i]-a[j];a[i]+=d;a[j]+=d;
      if(diff>0){if(a[j]<0){a[j]=0;a[i]=diff}}else{if(a[i]<0){a[i]=0;a[j]=-diff}}
      if(diff>0){if(a[i]>C){a[i]=C;a[j]=C-diff}}else{if(a[j]>C){a[j]=C;a[i]=C+diff}}
    }else{
      var d2=(G[i]-G[j])/quad,sum=a[i]+a[j];a[i]-=d2;a[j]+=d2;
      if(sum>C){if(a[i]>C){a[i]=C;a[j]=sum-C}}else{if(a[j]<0){a[j]=0;a[i]=sum}}
      if(sum>C){if(a[j]>C){a[j]=C;a[i]=sum-C}}else{if(a[i]<0){a[i]=0;a[j]=sum}}
    }
    var di=a[i]-ai,dj=a[j]-aj;
    for(t=0;t<n;t++)G[t]+=Y[t]*(Y[i]*K(t,i)*di+Y[j]*K(t,j)*dj);
  }
  var ub=Infinity,lb=-Infinity,nf=0,sf=0,eps=1e-9;
  for(t=0;t<n;t++){var yG=Y[t]*G[t];
    if(a[t]>=C-eps){if(Y[t]<0)ub=Math.min(ub,yG);else lb=Math.max(lb,yG)}
    else if(a[t]<=eps){if(Y[t]>0)ub=Math.min(ub,yG);else lb=Math.max(lb,yG)}
    else{nf++;sf+=yG}}
  var rho=nf?sf/nf:(ub+lb)/2;
  var w=new Array(D).fill(0);for(t=0;t<n;t++)for(var d=0;d<D;d++)w[d]+=a[t]*Y[t]*X[t][d];
  return {w:w,b:-rho,sv:a.map(function(v){return v>1e-6})};
}

/* ---------- data ---------- */
/* 1 variable (slides 398-405): sick left (low marker), healthy right */
var S1=[1.0,1.6,2.3,3.0], H1=[6.0,6.7,7.3,8.0,8.8], ODD=5.5, NEWX0=5.0;
/* 1D steps: cut-off, margin [lo, hi], support vectors, label */
var ONE={
  0:{odd:false,cut:null},
  1:{odd:false,cut:5.7},
  2:{odd:false,cut:4.5,m:[3.0,6.0],sv:[3.0,6.0],lab:"margin"},
  3:{odd:true,cut:5.75,m:[5.5,6.0],sv:[5.5,6.0],lab:"margin"},
  4:{odd:true,cut:4.5,m:[3.0,6.0],sv:[3.0,5.5,6.0],lab:"soft margin"}
};
/* 2 variables (slide 431): group A (+1, blue), group B (-1, red) */
var BASE2=[[3,6,1],[1,5,1],[2,6,1],[4,3,-1],[4,2,-1],[5,3,-1]], EXTRA=[4,6,-1];
var SLIDE={w:[-0.5,0.5],b:-0.5};          /* y = 1 + x, as on slides 432-446 */
var HARD=1000;
/* kernel trick (slides 455-456): sick at low and high dose, healthy in the middle */
var KS=[0.8,1.4,2.0,8.0,8.6,9.2], KH=[4.0,4.6,5.2,5.8];
var KFIT=(function(){var X=[],Y=[];KS.forEach(function(x){X.push([x/10,x*x/100]);Y.push(-1)});KH.forEach(function(x){X.push([x/10,x*x/100]);Y.push(1)});return svmFit(X,Y,1e4)})();
var KCUT=(function(){var A=KFIT.w[1]/100,B=KFIT.w[0]/10,C=KFIT.b,D=Math.sqrt(B*B-4*A*C);var r=[(-B-D)/(2*A),(-B+D)/(2*A)];return r.sort(function(a,b){return a-b})})();

/* 3D: dose, dose², dose³ (scaled to 0-1) */
function f3(x){var u=x/10;return [u,u*u,u*u*u]}
var K3FIT=(function(){var X=[],Y=[];KS.forEach(function(x){X.push(f3(x));Y.push(-1)});KH.forEach(function(x){X.push(f3(x));Y.push(1)});return svmFit(X,Y,1e4)})();
var K3CUT=(function(){function g(x){var p=f3(x);return K3FIT.w[0]*p[0]+K3FIT.w[1]*p[1]+K3FIT.w[2]*p[2]+K3FIT.b}var r=[],pv=g(0);for(var i=1;i<=2000;i++){var x=i/200,v=g(x);if((v>0)!==(pv>0))r.push(x);pv=v}return r})();
var TH0=0.75,PH0=0.35,K0=0.66;
var st={step:0,cam:{th:TH0,ph:PH0},userRot:false,spin:null,prev:0,t:1,anim:null,newX:NEWX0,d6:null,d7:null,cv:9};
function resetData(){st.d6=BASE2.map(function(p){return p.slice()});st.d7=BASE2.concat([EXTRA]).map(function(p){return p.slice()});st.newX=NEWX0;st.cv=9}
resetData();
function Cval(){return Math.pow(10,-1.3+3.3*st.cv/100)}
function cTxt(c){return c<1?c.toFixed(2):(c<10?c.toFixed(1):c.toFixed(0))}
function fit(pts,C){return svmFit(pts.map(function(p){return [p[0],p[1]]}),pts.map(function(p){return p[2]}),C)}
function stats(pts,m){var mis=0,ins=0,nsv=0;pts.forEach(function(p,i){var f=p[2]*(m.w[0]*p[0]+m.w[1]*p[1]+m.b);if(f<0)mis++;else if(f<1-1e-6)ins++;if(m.sv&&m.sv[i])nsv++});
  return {mis:mis,ins:ins,nsv:nsv,width:2/Math.hypot(m.w[0],m.w[1])}}
function model(step){
  if(step===5)return SLIDE;
  if(step===6)return fit(st.d6,HARD);
  if(step===7)return fit(st.d7,Cval());
  return null;
}
function pts(step){return step===7?st.d7:(step===6?st.d6:BASE2)}
function part(step){return step<=4?1:(step<=7?2:3)}
/* colour sick/healthy and group A/B in the texts */
function paint(txt){txt=txt.replace(/\b(sick|red)\b/g,'<b class="r">$1</b>').replace(/\b(healthy|blue)\b/g,'<b class="b">$1</b>').replace(/group A/g,'<b class="b">group A</b>').replace(/group B/g,'<b class="r">group B</b>');
  var parts=txt.split("||");return parts[0]+(parts[1]?'<span class="cl">'+parts[1]+'</span>':"")}

/* ---------- geometry helpers ---------- */
/* clip polygon (data coords) to half-plane a*x + b*y + c >= 0 */
function clipHalf(poly,a,b,c){var out=[];for(var i=0;i<poly.length;i++){var P=poly[i],Q=poly[(i+1)%poly.length];
  var fp=a*P[0]+b*P[1]+c,fq=a*Q[0]+b*Q[1]+c;if(fp>=0)out.push(P);
  if((fp>=0)!==(fq>=0)){var t=fp/(fp-fq);out.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])])}}return out}
function segment(dom,a,b,c){/* line a*x+b*y+c=0 clipped to the domain box */
  var pts=[],x0=dom[0],x1=dom[1],y0=dom[2],y1=dom[3];
  if(Math.abs(b)>1e-12){[x0,x1].forEach(function(x){var y=-(a*x+c)/b;if(y>=y0-1e-9&&y<=y1+1e-9)pts.push([x,y])})}
  if(Math.abs(a)>1e-12){[y0,y1].forEach(function(y){var x=-(b*y+c)/a;if(x>=x0-1e-9&&x<=x1+1e-9)pts.push([x,y])})}
  if(pts.length<2)return null;
  var best=[pts[0],pts[1]],bd=0;for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){var d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d>bd){bd=d;best=[pts[i],pts[j]]}}
  return best;
}
function Frame(L,R,T,B,dom){this.L=L;this.R=R;this.T=T;this.B=B;this.dom=dom}
Frame.prototype.x=function(v){return this.L+(v-this.dom[0])/(this.dom[1]-this.dom[0])*(this.R-this.L)};
Frame.prototype.y=function(v){return this.B-(v-this.dom[2])/(this.dom[3]-this.dom[2])*(this.B-this.T)};
Frame.prototype.ix=function(p){return this.dom[0]+(p-this.L)/(this.R-this.L)*(this.dom[1]-this.dom[0])};
Frame.prototype.iy=function(p){return this.dom[2]+(this.B-p)/(this.B-this.T)*(this.dom[3]-this.dom[2])};
Frame.prototype.box=function(){var d=this.dom;return [[d[0],d[2]],[d[1],d[2]],[d[1],d[3]],[d[0],d[3]]]};
Frame.prototype.fillPoly=function(g,poly,col){if(poly.length<3)return;var F=this;g.beginPath();poly.forEach(function(p,i){var X=F.x(p[0]),Y=F.y(p[1]);if(i)g.lineTo(X,Y);else g.moveTo(X,Y)});g.closePath();g.fillStyle=col;g.fill()};
Frame.prototype.line=function(g,a,b,c){var s=segment(this.dom,a,b,c);if(!s)return false;g.beginPath();g.moveTo(this.x(s[0][0]),this.y(s[0][1]));g.lineTo(this.x(s[1][0]),this.y(s[1][1]));g.stroke();return true};

function F2(){var S=H-30-78,L=(W-S)/2+18;return new Frame(L,L+S,30,H-78,[0,7,0,7])}
function FK(){return new Frame(100,W-30,30,H-130,[0,10,0,100])}
function X1(x){return 50+x/10*(W-100)}
var AY=250;

/* ---------- drawing primitives ---------- */
function label(g,txt,x,y,col,size,weight,align,base){g.font=(weight||"600")+" "+fs(size||18)+"px "+FONT;g.textAlign=align||"left";g.textBaseline=base||"alphabetic";
  g.lineJoin="round";g.lineWidth=6;g.strokeStyle=css("--panel");g.strokeText(txt,x,y);g.fillStyle=col;g.fillText(txt,x,y)}
function cross(g,x,y,col,alpha){var r=10*UC;g.save();g.globalAlpha=alpha===undefined?1:alpha;g.lineCap="round";
  g.strokeStyle=css("--panel");g.lineWidth=9*UC;g.beginPath();g.moveTo(x-r,y-r);g.lineTo(x+r,y+r);g.moveTo(x+r,y-r);g.lineTo(x-r,y+r);g.stroke();
  g.strokeStyle=col;g.lineWidth=5*UC;g.stroke();g.restore()}
function dot(g,x,y,col,r){g.beginPath();g.arc(x,y,(r||9)*UC,0,2*Math.PI);g.fillStyle=col;g.fill();g.lineWidth=2;g.strokeStyle=css("--panel");g.stroke()}
function ring(g,x,y,r,col,dash){g.save();if(dash)g.setLineDash([5,4]);g.beginPath();g.arc(x,y,r*UC,0,2*Math.PI);g.lineWidth=3;g.strokeStyle=col;g.stroke();g.restore()}
function arrow(g,x1,y1,x2,y2,col){var a=Math.atan2(y2-y1,x2-x1),h=10;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=2.5;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  [[x2,y2,a],[x1,y1,a+Math.PI]].forEach(function(e){g.beginPath();g.moveTo(e[0],e[1]);g.lineTo(e[0]-h*Math.cos(e[2]-0.4),e[1]-h*Math.sin(e[2]-0.4));g.lineTo(e[0]-h*Math.cos(e[2]+0.4),e[1]-h*Math.sin(e[2]+0.4));g.closePath();g.fill()})}

/* ---------- part 1: one variable ---------- */
function drawOne(g,t){
  var s=st.step,c=ONE[s],p=ONE[st.prev]||c,ink=css("--ink"),muted=css("--muted"),red=css("--red"),blue=css("--blue"),grey=css("--grey"),acc=css("--accent2");
  var e=ease(t),cut=c.cut, m=c.m;
  if(cut!==null&&p.cut!==null&&p!==c&&part(st.prev)===1)cut=lerp(p.cut,c.cut,e);
  if(m&&p.m&&p!==c&&part(st.prev)===1)m=[lerp(p.m[0],m[0],e),lerp(p.m[1],m[1],e)];
  /* class regions under the axis */
  if(cut!==null){
    var rh=fs(50)+50;
    g.fillStyle=css("--tred");g.fillRect(X1(0)-20,AY+30,X1(cut)-X1(0)+20,rh);
    g.fillStyle=css("--tblue");g.fillRect(X1(cut),AY+30,X1(10)+20-X1(cut),rh);
    label(g,"→ called sick",X1(cut)-12,AY+20+rh,red,18,"600","right");
    label(g,"→ called healthy",X1(cut)+12,AY+20+rh,blue,18,"600","left");
  }
  /* axis */
  g.strokeStyle=muted;g.lineWidth=4;g.beginPath();g.moveTo(X1(0)-20,AY);g.lineTo(X1(10)+20,AY);g.stroke();
  g.font=fs(16)+"px "+FONT;g.fillStyle=muted;g.textAlign="center";g.textBaseline="top";
  for(var k=0;k<=10;k++){g.beginPath();g.moveTo(X1(k),AY-6);g.lineTo(X1(k),AY+6);g.lineWidth=2;g.stroke();g.fillText(String(k),X1(k),AY+20)}
  label(g,"biomarker",W/2,AY+80+fs(80),ink,20,"600","center");
  /* margin bracket */
  if(m){
    var yb=AY-92;g.strokeStyle=acc;g.lineWidth=3;g.beginPath();g.moveTo(X1(m[0]),yb+14);g.lineTo(X1(m[0]),yb);g.lineTo(X1(m[1]),yb);g.lineTo(X1(m[1]),yb+14);g.stroke();
    g.setLineDash([4,5]);g.lineWidth=1.5;g.beginPath();g.moveTo(X1(m[0]),yb+14);g.lineTo(X1(m[0]),AY);g.moveTo(X1(m[1]),yb+14);g.lineTo(X1(m[1]),AY);g.stroke();g.setLineDash([]);

/* ---------- part 3b: three dimensions (dose, dose², dose³) ---------- */
function cam3(t){/* camera: from the flat front view (like the dose axis) to an oblique view */
  var e=ease(t),fr=st.prev===10&&t<1;
  return {th:fr?lerp(0,st.cam.th,e):st.cam.th,ph:fr?lerp(0,st.cam.ph,e):st.cam.ph,k:fr?lerp(1,K0,e):K0,lift:fr?e:1};
}
function P3(p,c){var F=FK(),SX=F.R-F.L,SY=F.B-F.T,SZ=SY,cx=(F.L+F.R)/2,cy=(F.T+F.B)/2;
  var X=(p[0]-0.5)*SX,Y=(p[1]-0.5)*SY,Z=(p[2]-0.5)*SZ,ct=Math.cos(c.th),sn=Math.sin(c.th);
  var X1=X*ct+Z*sn,Z1=-X*sn+Z*ct,Y2=Y*Math.cos(c.ph)-Z1*Math.sin(c.ph);
  var z=(1-c.k)/(1-K0);return [cx+50*z+c.k*X1,cy+30*z-c.k*Y2];}
function planePoly(n,b){/* plane n·p + b = 0 cut by the unit cube, as an ordered polygon */
  var V=[],E=[],i,j,k;for(i=0;i<8;i++)V.push([i&1,(i>>1)&1,(i>>2)&1]);
  for(i=0;i<8;i++)for(k=0;k<3;k++){j=i|(1<<k);if(j===i)continue;var a=V[i],c=V[j],fa=n[0]*a[0]+n[1]*a[1]+n[2]*a[2]+b,fc=n[0]*c[0]+n[1]*c[1]+n[2]*c[2]+b;
    if((fa>0)!==(fc>0)){var t=fa/(fa-fc);E.push([a[0]+t*(c[0]-a[0]),a[1]+t*(c[1]-a[1]),a[2]+t*(c[2]-a[2])])}}
  if(E.length<3)return E;
  var m=[0,0,0];E.forEach(function(q){m[0]+=q[0]/E.length;m[1]+=q[1]/E.length;m[2]+=q[2]/E.length});
  var e1=Math.abs(n[0])<0.9?[0,n[2],-n[1]]:[n[2],0,-n[0]],e2=[n[1]*e1[2]-n[2]*e1[1],n[2]*e1[0]-n[0]*e1[2],n[0]*e1[1]-n[1]*e1[0]];
  function dt(u,v){return u[0]*v[0]+u[1]*v[1]+u[2]*v[2]}
  E.sort(function(A,B){var a=[A[0]-m[0],A[1]-m[1],A[2]-m[2]],bb=[B[0]-m[0],B[1]-m[1],B[2]-m[2]];return Math.atan2(dt(a,e2),dt(a,e1))-Math.atan2(dt(bb,e2),dt(bb,e1))});
  return E;
}
function draw3D(g,t){
  var c=cam3(t),ink=css("--ink"),muted=css("--muted"),line=css("--line"),red=css("--red"),blue=css("--blue"),acc=css("--accent2");
  var fade=st.prev===10&&t<1?ease(t):1,F=FK(),SX=F.R-F.L,SY=F.B-F.T,n=K3FIT.w,b0=K3FIT.b;
  /* which side of the plane faces the viewer: points behind the plane are drawn paler */
  var nv=n[0]*(-Math.sin(c.th)*Math.cos(c.ph))/SX+n[1]*Math.sin(c.ph)/SY+n[2]*Math.cos(c.th)*Math.cos(c.ph)/SY;
  function fval(p){return n[0]*p[0]+n[1]*p[1]+n[2]*p[2]+b0}
  function behind(p){return fade>0.5&&(fval(p)>0)===(nv>0)}
  function seg(a,b){var A=P3(a,c),B=P3(b,c);g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}
  function lifted(x){var p=f3(x);return [p[0],p[1]*c.lift,p[2]*c.lift]}
  function pts(back){KS.forEach(function(x){var p=lifted(x);if(behind(p)===back){var q=P3(p,c);cross(g,q[0],q[1],red,back?0.35:1)}});
    KH.forEach(function(x){var p=lifted(x);if(behind(p)===back){var q=P3(p,c);cross(g,q[0],q[1],blue,back?0.35:1)}})}
  function curve(back){g.save();g.strokeStyle=muted;g.lineWidth=2;g.setLineDash([3,5]);g.globalAlpha=back?0.4:1;
    for(var u=0;u<1;u+=0.01){var p=[u,u*u*c.lift,u*u*u*c.lift],q=[u+0.01,(u+0.01)*(u+0.01)*c.lift,Math.pow(u+0.01,3)*c.lift];if(behind(p)===back)seg(p,q)}g.restore()}
  /* cube and axes */
  g.save();g.globalAlpha=fade;g.strokeStyle=line;g.lineWidth=1.5;
  for(var i=0;i<8;i++)for(var k=0;k<3;k++){var j=i|(1<<k);if(j!==i)seg([i&1,(i>>1)&1,(i>>2)&1],[j&1,(j>>1)&1,(j>>2)&1])}
  g.restore();

  /* behind the plane */

  if(poly.length>2){g.beginPath();poly.forEach(function(q,i){if(i)g.lineTo(q[0],q[1]);else g.moveTo(q[0],q[1])});g.closePath();g.fillStyle="rgba(246,164,32,.30)";g.fill();g.strokeStyle=acc;g.lineWidth=3;g.stroke()}
  g.restore();

  pts(false);
  /* labels */
  var ax=P3([1.12,0,0],c);label(g,"dose",ax[0],ax[1]+6,ink,19,"700","left","middle");
  g.save();g.globalAlpha=fade;var ay=P3([0,1.12,0],c),az=P3([0,0,1.14],c);
  label(g,"dose²",ay[0],ay[1]-6,ink,19,"700","center");label(g,"dose³",az[0],az[1]+fs(14),ink,19,"700","center","middle");
  if(t>=1){var pc=poly.length?poly.reduce(function(m,q){return [m[0]+q[0]/poly.length,m[1]+q[1]/poly.length]},[0,0]):[W/2,H/2];
    var top=poly.reduce(function(m,q){return q[1]<m[1]?q:m},[0,1e9]);label(g,"SVM plane",top[0],top[1]-10,acc,18,"700","center")}
  g.restore();
}
function startSpin(){

    var g=$("cv").getContext("2d");g.setTransform(1,0,0,1,0,0);g.fillStyle=css("--panel");g.fillRect(0,0,W,H);st.prev=11;draw3D(g,1);
    st.spin=requestAnimationFrame(tick)}

/* ---------- texts ---------- */
var TITLES=["One biomarker, sick and healthy","A cut-off right next to the healthy group","The cut-off in the middle","One unusual sick person","Soft margin: allow a mistake",
  "Two variables: a line instead of a point","The SVM finds the widest street","Real data are not perfect: the penalty C",
  "Kernel trick: one cut-off is not enough","Add a new axis: dose²","Back on the dose axis: two cut-offs","Three dimensions: a plane instead of a line"];
function say(){
  var s=st.step;
  switch(s){
    case 0:return "A blood marker was measured in sick (red) and healthy (blue) people. Now a new patient comes in. Where should we put the cut-off, so that the next patient is classified correctly? Press Next.";
    case 1:return "Here the cut-off sits right next to the healthy group. Everything to the left is called sick. The new patient is much closer to the healthy people, but is called sick. Not a good place.";
    case 2:return "Better: put the cut-off exactly in the middle between the two closest points of the groups. The gap between them is the margin, the two points are the support vectors. Now the new patient is called healthy.";
    case 3:return "Now one sick person has a high value, close to the healthy group. The middle between the closest points moves right next to the healthy group: the margin is tiny and the new patient is called sick again. One unusual person decides everything.";
    case 4:return "Alternative: accept one mistake in the training data. The cut-off goes back into the wide gap. The unusual sick person is now misclassified, but the margin is wide and the new patient is called healthy. A margin that allows mistakes is a soft margin. All points on or inside it are support vectors. Drag the new patient to try other values.";
    case 5:return "With two variables (x and y, e.g. LDL and HDL cholesterol) the cut-off becomes a line. Data: group A (blue) and group B (red). The line y = 1 + x separates both groups. The dashed lines through the closest points show the street: margin 2.83. Is this the widest possible street?";
    case 6:var r=stats(st.d6,model(6));
      return "The SVM turns and shifts the line until the street is as wide as possible: here "+f2(r.width)+" instead of 2.83. Only the ringed points (support vectors) decide where the line goes. Drag a point: move a support vector and the line follows; move another point and nothing changes, as long as it stays outside the street. Reset points brings them back."+
        (r.mis>0?" Now no straight line separates the groups without mistakes. The next step shows what to do then.":"");
    case 7:var m=model(7),q=stats(st.d7,m),now;
      if(q.mis>0)now="Now: soft margin, wide street ("+f2(q.width)+"), "+q.mis+" point"+(q.mis>1?"s":"")+" on the wrong side (dashed ring).";
      else if(q.ins>0)now="Now: no point on the wrong side, but "+q.ins+" inside the street. Street width "+f2(q.width)+".";
      else now="Now: hard margin, no mistakes, but a narrow street ("+f2(q.width)+"). Risk of overfitting.";
      return "A new point of group B lies at (4, 6), among group A. The slider C sets how much a mistake costs. Small C: soft margin, a wide street, some mistakes accepted. Large C: hard margin, no mistakes, a narrow street. The best C is found by cross-validation. "+now+"||In the Classification Learner, C is called Box constraint level.";
    case 8:return "Too little or too much of a drug: patients stay sick (red). Only the middle dose cures them (blue). Wherever you put one cut-off, one side stays mixed. Idea: give the data a second axis.";
    case 9:return "Each patient gets a second value: the dose squared. Now the points lie on a curve, and a straight line separates sick from healthy. The SVM works exactly as before, only one dimension higher.";
    case 10:return "Back on the dose axis, the straight line becomes two cut-offs: sick below "+f1(KCUT[0])+", healthy between "+f1(KCUT[0])+" and "+f1(KCUT[1])+", sick above. This is the kernel trick (here a polynomial kernel with d = 2). It gives the same result without actually computing the new axis.||In the Classification Learner: Quadratic SVM.";
    case 11:return "One more axis: each patient also gets dose³. The points now lie on a curve in space, and the SVM separates them with a flat plane. Every extra axis makes the boundary more flexible. The Gaussian (RBF) kernel works as if there were infinitely many axes. Drag to turn the picture.||In the Classification Learner: Quadratic SVM uses dose², Cubic SVM also dose³, Gaussian SVM the RBF kernel.";
  }
}
function nums(){
  var s=st.step,K=[],V=[];
  if(s<=4){var c=ONE[s];K=["Cut-off","Margin width","Mistakes in training"];
    V=[c.cut===null?"–":f2(c.cut),c.m?f1(c.m[1]-c.m[0]):"–",c.cut===null?"–":(s===4?"1":"0")]}
  else if(s<=7){var m=model(s),r=stats(pts(s),m);K=["Margin width","Support vectors","Misclassified"];
    V=[f2(r.width),s===5?"2":String(r.nsv),String(r.mis)]}
  else{K=["Dimensions","Cut-offs","Mistakes in training"];
    V=[s===9?"2":(s===11?"3":"1"),s===10?f1(KCUT[0])+" and "+f1(KCUT[1]):(s===9?"line":(s===11?f1(K3CUT[0])+" and "+f1(K3CUT[1]):"?")),s===8?"–":"0"]}
  return [K,V];
}
function legend(){
  var p=part(st.step);
  if(p===1)return '<b class="r">✖</b> sick &nbsp; <b class="b">✖</b> healthy &nbsp; <b class="g">◯</b> new patient (draggable) &nbsp; ◯ support vector';
  if(p===2)return '<b class="b">●</b> group A &nbsp; <b class="r">●</b> group B &nbsp; ◯ support vector &nbsp; dashed ring: wrong side'+(st.step===6?' &nbsp; · points can be dragged':'');
  return '<b class="r">✖</b> sick &nbsp; <b class="b">✖</b> healthy'+(st.step===11?' &nbsp; · drag to turn':'');
}

/* ---------- render ---------- */
function render(t){
  setU();if(t===undefined)t=1;st.t=t;
  var s=st.step,cv=$("cv"),g=cv.getContext("2d");
  H=hFor(s);if(cv.height!==H){cv.height=H;cv.style.aspectRatio="760/"+H}
  g.setTransform(1,0,0,1,0,0);g.fillStyle=css("--panel");g.fillRect(0,0,W,H);
  if(part(s)===1)drawOne(g,t);else if(part(s)===2)drawTwo(g,t);else if(s===11)draw3D(g,t);else drawKernel(g,t);
  if(t<1)return;
  $("title").textContent=TITLES[s];$("legend").innerHTML=legend();$("say").innerHTML=paint(say());
  var n=nums();["1","2","3"].forEach(function(k,i){$("k"+k).textContent=n[0][i];$("v"+k).textContent=n[1][i]});
  $("stepno").textContent="Step "+(s+1)+" of "+(LAST+1);
  $("back").disabled=s===0;$("next").disabled=s===LAST;
  $("cBox").hidden=s!==7;$("c").value=st.cv;$("cOut").textContent=cTxt(Cval());
  ["p1","p2","p3"].forEach(function(id,i){$(id).setAttribute("aria-pressed",part(s)===i+1?"true":"false")});
  cv.classList.toggle("free",s===6||s===11);$("rp").hidden=s!==6;
}
function stopAnim(){if(st.anim){cancelAnimationFrame(st.anim);st.anim=null}}
function go(n,animate){
  stopAnim();n=Math.max(0,Math.min(LAST,n));if(n!==st.step)st.newX=NEWX0;st.prev=st.step;st.step=n;
  if(!animate||n!==st.prev+1){st.prev=n;render(1);startSpin();return}
  var t0=null;render(0);
  /* texts change at once, the picture moves */
  st.t=1;var keep=st.anim;
  function tick(now){if(t0===null)t0=now;var t=Math.min(1,(now-t0)/ANIM);render(t);st.anim=t<1?requestAnimationFrame(tick):null;if(t>=1){render(1);startSpin()}}
  st.anim=requestAnimationFrame(tick);
  updateTexts();
}
function updateTexts(){var s=st.step;$("title").textContent=TITLES[s];$("legend").innerHTML=legend();$("say").innerHTML=paint(say());
  var n=nums();["1","2","3"].forEach(function(k,i){$("k"+k).textContent=n[0][i];$("v"+k).textContent=n[1][i]});
  $("stepno").textContent="Step "+(s+1)+" of "+(LAST+1);$("back").disabled=s===0;$("next").disabled=s===LAST;
  $("cBox").hidden=s!==7;$("rp").hidden=s!==6;["p1","p2","p3"].forEach(function(id,i){$(id).setAttribute("aria-pressed",part(s)===i+1?"true":"false")})}

/* ---------- dragging ---------- */
var cv=$("cv"),drag=null;
function pick(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function nearest(pt){
  var s=st.step,R=30*U;
  if(s<=4){var nx=X1(st.newX),ny=AY-150;return Math.hypot(pt[0]-nx,pt[1]-ny)<R+8||(Math.abs(pt[0]-nx)<R&&pt[1]>ny-40&&pt[1]<AY)?{k:"new"}:null}
  if(s===6){var F=F2(),P=pts(s),best=null,bd=R;P.forEach(function(p,i){var d=Math.hypot(pt[0]-F.x(p[0]),pt[1]-F.y(p[1]));if(d<bd){bd=d;best={k:"pt",i:i}}});return best}
  return null;
}
cv.addEventListener("pointerdown",function(e){if(st.step===11){var q=pick(e);drag={k:"rot",x:q[0],y:q[1],th:st.cam.th,ph:st.cam.ph};st.userRot=true;try{cv.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault();return}var k=nearest(pick(e));if(!k)return;stopAnim();st.prev=st.step;drag=k;cv.style.cursor="grabbing";try{cv.setPointerCapture(e.pointerId)}catch(err){}e.preventDefault()});
cv.addEventListener("pointermove",function(e){var pt=pick(e);
  if(!drag){cv.style.cursor=(st.step===11||nearest(pt))?"grab":"default";return}
  if(drag.k==="rot"){st.cam.th=drag.th+(pt[0]-drag.x)*0.008;st.cam.ph=Math.max(-0.3,Math.min(1.3,drag.ph+(pt[1]-drag.y)*0.008));st.prev=11;render(1);e.preventDefault();return}
  if(drag.k==="new"){st.newX=Math.max(0,Math.min(10,(pt[0]-50)/(W-100)*10))}
  else{var F=F2(),P=pts(st.step);P[drag.i][0]=Math.max(0.2,Math.min(6.8,F.ix(pt[0])));P[drag.i][1]=Math.max(0.2,Math.min(6.8,F.iy(pt[1])))}
  render(1);e.preventDefault()});
function endDrag(){if(drag){drag=null;cv.style.cursor="default";render(1)}}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);

/* ---------- controls ---------- */
$("next").addEventListener("click",function(){go(st.step+1,true)});
$("back").addEventListener("click",function(){go(st.step-1,false)});
$("reset").addEventListener("click",function(){resetData();st.userRot=false;st.cam={th:TH0,ph:PH0};go(0,false)});
$("rp").addEventListener("click",function(){st.d6=BASE2.map(function(p){return p.slice()});st.prev=st.step;render(1)});
$("p1").addEventListener("click",function(){go(0,false)});
$("p2").addEventListener("click",function(){go(5,false)});
$("p3").addEventListener("click",function(){go(8,false)});
$("c").addEventListener("input",function(e){st.cv=+e.target.value;st.prev=st.step;render(1)});
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"){if(st.step<LAST)go(st.step+1,true);e.preventDefault()}
  else if(e.key==="ArrowLeft"){go(st.step-1,false);e.preventDefault()}
});
$("full").addEventListener("click",function(){
  try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}catch(err){}
});
var lastW=window.innerWidth;window.addEventListener("resize",function(){if(window.innerWidth===lastW)return;lastW=window.innerWidth;render(1)});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){render(1)});
/* start step from the link: ?step=N or #step=N (1-11) */
var m=(location.search+location.hash).match(/step=(\d+)/);
var s0=m?Math.max(1,Math.min(LAST+1,+m[1]))-1:0;
st.step=s0;st.prev=s0;render(1);startSpin();
})();
</script>
</body>
